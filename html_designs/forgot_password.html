<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RoomEase - Forgot Password</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #E8EAF6 0%, #E0F2F1 50%, #FFFFFF 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            width: 100%;
            max-width: 400px;
        }
        
        .card {
            background: white;
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 8px 24px rgba(63, 81, 181, 0.3);
        }
        
        .logo-container {
            text-align: center;
            margin-bottom: 16px;
        }
        
        .logo {
            width: 100px;
            height: 100px;
            object-fit: contain;
        }
        
        .app-name {
            font-size: 24px;
            font-weight: 700;
            color: #3F51B5;
            text-align: center;
            margin-bottom: 8px;
        }
        
        .subtitle {
            font-size: 16px;
            font-weight: 500;
            color: #757575;
            text-align: center;
            margin-bottom: 8px;
        }
        
        .description {
            font-size: 14px;
            color: #757575;
            text-align: center;
            margin-bottom: 24px;
            line-height: 1.5;
        }
        
        .form-group {
            margin-bottom: 24px;
        }
        
        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 400;
            color: #757575;
            margin-bottom: 8px;
        }
        
        .input-wrapper {
            position: relative;
        }
        
        .input-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #3F51B5;
            font-size: 18px;
        }
        
        .form-input {
            width: 100%;
            padding: 12px 12px 12px 44px;
            font-size: 14px;
            font-family: 'Poppins', sans-serif;
            border: 1px solid #E0E0E0;
            border-radius: 12px;
            background: #FAFAFA;
            transition: all 0.3s;
        }
        
        .form-input:focus {
            outline: none;
            border: 2px solid #3F51B5;
            background: white;
        }
        
        .btn-primary {
            width: 100%;
            padding: 16px;
            font-size: 16px;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
            color: white;
            background: #3F51B5;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(63, 81, 181, 0.3);
            transition: all 0.3s;
        }
        
        .btn-primary:hover {
            background: #303F9F;
            box-shadow: 0 4px 12px rgba(63, 81, 181, 0.4);
        }
        
        .success-message {
            background: #E8F5E8;
            border: 1px solid #4CAF50;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 24px;
            display: none;
        }
        
        .success-message.show {
            display: block;
        }
        
        .success-icon {
            color: #4CAF50;
            font-size: 20px;
            margin-right: 8px;
        }
        
        .success-text {
            color: #2E7D32;
            font-size: 14px;
            font-weight: 500;
        }
        
        .back-to-login {
            text-align: center;
            margin-top: 24px;
        }
        
        .back-to-login a {
            color: #3F51B5;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        
        .back-to-login a:hover {
            text-decoration: underline;
        }
        
        .info-box {
            background: #E3F2FD;
            border: 1px solid #2196F3;
            border-radius: 12px;
            padding: 16px;
            margin-top: 24px;
        }
        
        .info-icon {
            color: #2196F3;
            font-size: 16px;
            margin-right: 8px;
        }
        
        .info-text {
            color: #1565C0;
            font-size: 12px;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="logo-container">
                <img src="../png/logo.png" alt="RoomEase Logo" class="logo">
            </div>
            
            <h1 class="app-name">RoomEase</h1>
            <p class="subtitle">Reset Your Password</p>
            <p class="description">
                Enter your email address and we'll send you a link to reset your password.
            </p>
            
            <div class="success-message" id="successMessage">
                <div style="display: flex; align-items: center;">
                    <span class="success-icon">✅</span>
                    <span class="success-text">Password reset email sent! Check your inbox.</span>
                </div>
            </div>
            
            <form id="resetForm">
                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <div class="input-wrapper">
                        <span class="input-icon">📧</span>
                        <input type="email" class="form-input" placeholder="Enter your email" required>
                    </div>
                </div>
                
                <button type="submit" class="btn-primary">Send Reset Link</button>
            </form>
            
            <div class="info-box">
                <div style="display: flex; align-items: flex-start;">
                    <span class="info-icon">ℹ️</span>
                    <span class="info-text">
                        If you don't receive an email within a few minutes, please check your spam folder or try again.
                    </span>
                </div>
            </div>
            
            <div class="back-to-login">
                <a href="login.html">
                    <span>←</span>
                    Back to Login
                </a>
            </div>
        </div>
    </div>
    
    <script>
        document.getElementById('resetForm').addEventListener('submit', function(e) {
            e.preventDefault();
            document.getElementById('successMessage').classList.add('show');
        });
    </script>
</body>
</html>
