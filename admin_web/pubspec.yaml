name: roomease_admin
description: RoomEase Admin Dashboard - Web-only administration panel
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI
  cupertino_icons: ^1.0.8
  
  # State Management
  provider: ^6.1.2
  
  # HTTP & API
  dio: ^5.4.3
  
  # Firebase (for admin auth only) - Compatible versions
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4
  
  # Charts & Visualization
  fl_chart: ^0.68.0
  
  # Utilities
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  # Uncomment when you add assets
  # assets:
  #   - assets/images/
  #   - assets/icons/
