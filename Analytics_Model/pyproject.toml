[project]
name = "roomease-ml"
version = "0.1.0"
description = "ML models for RoomEase expense tracking"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0.3",
    "numpy>=1.24.3",
    "matplotlib>=3.7.2",
    "seaborn>=0.12.2",
    "scikit-learn>=1.3.0",
    "xgboost>=1.7.6",
    "lightgbm>=4.0.0",
    "catboost>=1.2",
    "faker>=19.3.1",
    "tqdm>=4.66.1",
    "jupyter>=1.0.0",
    "ipykernel>=6.25.0",
    "plotly>=5.17.0",
    "imbalanced-learn>=0.11.0",
    "optuna>=3.3.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["generators", "scripts", "models"]