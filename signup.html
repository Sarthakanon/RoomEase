<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RoomEase - Sign Up</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #E8EAF6 0%, #E0F2F1 50%, #FFFFFF 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            width: 100%;
            max-width: 400px;
        }
        
        .card {
            background: white;
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 8px 24px rgba(63, 81, 181, 0.3);
        }
        
        .logo-container {
            text-align: center;
            margin-bottom: 16px;
        }
        
        .logo {
            width: 100px;
            height: 100px;
            object-fit: contain;
        }
        
        .app-name {
            font-size: 24px;
            font-weight: 700;
            color: #3F51B5;
            text-align: center;
            margin-bottom: 8px;
        }
        
        .subtitle {
            font-size: 16px;
            font-weight: 500;
            color: #757575;
            text-align: center;
            margin-bottom: 24px;
        }
        
        .form-group {
            margin-bottom: 16px;
        }
        
        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 400;
            color: #757575;
            margin-bottom: 8px;
        }
        
        .input-wrapper {
            position: relative;
        }
        
        .input-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #3F51B5;
            font-size: 18px;
        }
        
        .form-input {
            width: 100%;
            padding: 12px 12px 12px 44px;
            font-size: 14px;
            font-family: 'Poppins', sans-serif;
            border: 1px solid #E0E0E0;
            border-radius: 12px;
            background: #FAFAFA;
            transition: all 0.3s;
        }
        
        .form-input:focus {
            outline: none;
            border: 2px solid #3F51B5;
            background: white;
        }
        
        .password-hint {
            font-size: 12px;
            color: #757575;
            margin-top: 4px;
        }
        
        .btn-primary {
            width: 100%;
            padding: 16px;
            font-size: 16px;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
            color: white;
            background: #3F51B5;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(63, 81, 181, 0.3);
            transition: all 0.3s;
            margin-top: 24px;
        }
        
        .btn-primary:hover {
            background: #303F9F;
            box-shadow: 0 4px 12px rgba(63, 81, 181, 0.4);
        }
        
        .divider {
            display: flex;
            align-items: center;
            margin: 24px 0;
        }
        
        .divider-line {
            flex: 1;
            height: 1px;
            background: #E0E0E0;
        }
        
        .divider-text {
            padding: 0 16px;
            color: #757575;
            font-weight: 500;
        }
        
        .btn-google {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
            color: #212121;
            background: white;
            border: 1.5px solid #E0E0E0;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: all 0.3s;
        }
        
        .btn-google:hover {
            background: #F5F5F5;
            border-color: #BDBDBD;
        }
        
        .google-icon {
            width: 24px;
            height: 24px;
        }
        
        .login-link {
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
        }
        
        .login-link span {
            color: #757575;
        }
        
        .login-link a {
            color: #3F51B5;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="logo-container">
                <img src="png/logo.png" alt="RoomEase Logo" class="logo">
            </div>
            
            <h1 class="app-name">RoomEase</h1>
            <p class="subtitle">Create Your Account</p>
            
            <form>
                <div class="form-group">
                    <label class="form-label">Full Name</label>
                    <div class="input-wrapper">
                        <span class="input-icon">👤</span>
                        <input type="text" class="form-input" placeholder="Enter your full name">
                    </div>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <div class="input-wrapper">
                        <span class="input-icon">📧</span>
                        <input type="email" class="form-input" placeholder="Enter your email">
                    </div>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <div class="input-wrapper">
                        <span class="input-icon">🔒</span>
                        <input type="password" class="form-input" placeholder="Create a password">
                    </div>
                    <p class="password-hint">Must be 8+ characters with uppercase, number & special character</p>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Confirm Password</label>
                    <div class="input-wrapper">
                        <span class="input-icon">🔒</span>
                        <input type="password" class="form-input" placeholder="Confirm your password">
                    </div>
                </div>
                
                <button type="submit" class="btn-primary">Create Account</button>
                
                <div class="divider">
                    <div class="divider-line"></div>
                    <span class="divider-text">OR</span>
                    <div class="divider-line"></div>
                </div>
                
                <button type="button" class="btn-google">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" class="google-icon">
                    Continue with Google
                </button>
                
                <div class="login-link">
                    <span>Already have an account?</span>
                    <a href="#">Sign In</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
